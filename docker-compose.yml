version: "3.9"

services:
  web:
    container_name: web
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    env_file:  
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static:/app/static
    environment:
      - DJANGO_SETTINGS_MODULE=notification_service.settings
    links:
      - redis:redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/notifications/stats/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    container_name: worker
    build: .
    env_file:  
      - .env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    links:
      - redis:redis
    command: celery -A notification_service.celery worker -l info
    networks:
      - app-network
    restart: unless-stopped

  beat:
    container_name: beat
    build: .
    env_file:  
      - .env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    links:
      - redis:redis
    command: celery -A notification_service.celery beat -l info
    networks:
      - app-network
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7.2-alpine
    ports:  
      - "6379:6379"
    volumes:  
      - ./redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    container_name: postgres
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  static:

networks:
  app-network:
    driver: bridge
